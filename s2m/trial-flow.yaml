

appId: dev.rehearsal.sim
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "れんしゅう"
    timeout: 90000
- waitForAnimationToEnd

- runFlow:
    when:
      visible: "ID・パスワードでログイン"
    commands:
      - takeScreenshot: 00-mode
      - tapOn: "ID・パスワードでログイン"
- extendedWaitUntil:
    visible: "例: 001"
    timeout: 30000
- runFlow:
    when:
      true: ${ORIENT == "LANDSCAPE"}
    commands:
      - setOrientation: LANDSCAPE_LEFT
      - waitForAnimationToEnd
- takeScreenshot: 01-login
- tapOn: "例: 001"
- inputText: ${LOGIN_ID}
- tapOn:
    text: "パスワード"
    index: 1
- inputText: ${LOGIN_PW}
- pressKey: Enter
- extendedWaitUntil:
    visible: "ホーム"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: 02-home


- tapOn:
    text: "ホーム"
    index: 1
    optional: true
- extendedWaitUntil:
    visible: "記録の一覧"
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible: "記録の一覧"
    commands:
      - tapOn:
          text: "ホーム"
          index: 0
- extendedWaitUntil:
    visible: "記録の一覧"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 03-list-top
- tapOn: "記録の一覧"
- extendedWaitUntil:
    visible: "月をえらぶ"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 04-list
- repeat:
    times: 6
    while:
      notVisible: ".*の記録（画像.*枚）を開く"
    commands:
      - tapOn: "前の月"
      - waitForAnimationToEnd
- takeScreenshot: 05-list-with-record
- tapOn: ".*の記録（画像.*枚）を開く"
- waitForAnimationToEnd
- takeScreenshot: 06-record-open
