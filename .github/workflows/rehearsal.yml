name: rehearsal
run-name: rehearsal ${{ inputs.tag || github.event_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fault:
        description: "none | a | b | c-up | d-cold | d-cap | e"
        required: true
        default: none
        type: choice
        options: [none, a, b, c-up, d-cold, d-cap, e]
      gate_only:
        description: "none = full run | A = network then boot | B = boot then network (Gate a measurement only)"
        required: false
        default: none
        type: choice
        options: [none, A, B]
      stage:
        description: "2 = whole run | 1 = stage 1 only (machine, network, one sign-in, one status)"
        required: false
        default: "2"
        type: choice
        options: ["2", "1"]
      tag:
        description: "label to find this run (record only)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  statuses: write

# Each run is its own group (never cancelled by another run). How many run side by side is held to the
# official limit (5 macOS jobs at a time) by the dispatcher, which counts queued and running runs first.
concurrency:
  group: rehearsal-${{ github.run_id }}
  cancel-in-progress: false

# Step order and limits follow a mirrored stage-2 layout: Gate a, updates off, npm ci, prebuild, pods,
# fixed-name build, Gate b, iPhone run, pass marker. Every step publishes out/ to upload/ only after the scrub.
jobs:
  ios-sim:
    runs-on: macos-26
    timeout-minutes: 42
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_NO_TELEMETRY: "1"
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
      MAESTRO_VERSION: "2.12.1"
      CM_DEADLINE_SEC: ${{ inputs.fault == 'd-cap' && '700' || '1866' }}
      CM_FILE_ENV: out/cm.env
      AUTH_REGION: ap-northeast-1
      # Made-up practice values (no account exists for them).
      E2E_0003_LOGIN: "001"
      E2E_0003_PASSWORD: Rh-Practice-9x
      FAULT: ${{ inputs.fault || 'none' }}
      GATE_ONLY: ${{ inputs.gate_only || 'none' }}
      STAGE: ${{ inputs.stage || '2' }}
      FAULT_HOOK: ${{ inputs.fault && inputs.fault != 'none' && 'rehearsal/fault.sh' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: CocoaPods 1.16.2
        shell: bash
        run: |
          sudo gem install cocoapods -v 1.16.2 --no-document > /dev/null
          P=$(command -v pod); mkdir -p "$HOME/pin-bin"
          printf '#!/bin/bash\nexec %s _1.16.2_ "$@"\n' "$P" > "$HOME/pin-bin/pod"; chmod +x "$HOME/pin-bin/pod"
          echo "$HOME/pin-bin" >> "$GITHUB_PATH"; "$HOME/pin-bin/pod" --version

      - name: Probe (stage 1, records only, always exit 0)
        if: env.STAGE == '1'
        shell: bash
        env:
          CM_TAG: cm-stage1-rehearsal
          GH_STATUS_TOKEN: ${{ github.token }}
          CM_REPO_SLUG: ${{ github.repository }}
          CM_COMMIT: ${{ github.sha }}
        run: |
          #!/bin/bash
          . .maestro/cm-lim.sh step=probe; trap cm_publish EXIT
          bash .maestro/cm-probe.sh 2>&1 | tee out/probe-console.log || true
          exit 0

      - name: Gate a - toolchain, simulator, Maestro, network (first minutes)
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p out/logs; : > "$CM_FILE_ENV"
          . .maestro/cm-lim.sh; trap cm_publish EXIT
          lim 90 bash .maestro/cm-gates.sh toolchain 2>&1 | tee out/logs/a-toolchain.log
          IPHONE_UDID=$(sed -n 's/^IPHONE_UDID=//p' out/sims.env)
          if [ "$FAULT" = d-cold ]; then
            lim 120 xcrun simctl erase "$IPHONE_UDID" 2>&1 | tee out/logs/a-boot.log; echo "fault d-cold: erased, no early boot" | tee -a out/logs/a-boot.log
          else
            lim 60 xcrun simctl boot "$IPHONE_UDID" 2>&1 | tee out/logs/a-boot.log || true
          fi
          lim 30 bash .maestro/netcheck.sh out/logs/a-net.txt gate-a || { echo "GATE a FAIL: auth host unreachable from the Mac"; exit 1; }
          lim 120 bash -c 'set -o pipefail; curl -fsSL "https://get.maestro.mobile.dev" | bash' 2>&1 | tee out/logs/maestro-install.log
          MVS=$(lim 30 "$HOME/.maestro/bin/maestro" --version 2>/dev/null | { grep -x -E '[0-9]+\.[0-9]+\.[0-9]+' || true; } | sort -u | tr '\n' ' ' | sed 's/ $//')
          echo "maestro $MVS" | tee -a out/logs/maestro-install.log
          [ "$MVS" = "$MAESTRO_VERSION" ] || { echo "GATE a FAIL: maestro [$MVS], expected exactly $MAESTRO_VERSION"; exit 1; }
          echo "GATE a ok"

      - name: Gate a measurement (A = network then boot, B = boot then network)
        if: env.GATE_ONLY != 'none' && env.STAGE == '2'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/logs; : > "$CM_FILE_ENV"; M=out/logs/gate-measure.txt
          . .maestro/cm-lim.sh; trap cm_publish EXIT
          t() { date +%s; }
          echo "form=$GATE_ONLY runner=$RUNNER_NAME image=$ImageVersion start=$(date -u +%H:%M:%SZ)" | tee "$M"
          s=$(t); lim 90 bash .maestro/cm-gates.sh toolchain > out/logs/a-toolchain.log 2>&1; echo "toolchain rc=$? s=$(( $(t)-s ))" | tee -a "$M"
          IPHONE_UDID=$(sed -n 's/^IPHONE_UDID=//p' out/sims.env)
          boot() { s=$(t); lim 60 xcrun simctl boot "$IPHONE_UDID" > out/logs/a-boot.log 2>&1; echo "boot-cmd rc=$? s=$(( $(t)-s ))" | tee -a "$M"; BOOT_AT=$(t); }
          net() { s=$(t); lim 120 bash .maestro/netcheck.sh out/logs/a-net.txt "form-$GATE_ONLY" > /dev/null 2>&1; echo "netcheck rc=$? s=$(( $(t)-s )) $(tail -1 out/logs/a-net.txt 2>/dev/null)" | tee -a "$M"
            s=$(t); lim 400 bash -c 'set -o pipefail; curl -fsSL "https://get.maestro.mobile.dev" | bash' > out/logs/maestro-install.log 2>&1; echo "maestro-install rc=$? s=$(( $(t)-s ))" | tee -a "$M"; }
          if [ "$GATE_ONLY" = A ]; then net; boot; else boot; net; fi
          lim 480 xcrun simctl bootstatus "$IPHONE_UDID" -b > /dev/null 2>&1; echo "booted rc=$? s-from-boot-cmd=$(( $(t)-BOOT_AT ))" | tee -a "$M"
          echo "memory-after free_mb=$(( $(vm_stat | awk '/Pages free|Pages inactive|Pages speculative/ {gsub(/[.]/,"",$NF); s+=$NF} END {print s+0}') * $(sysctl -n hw.pagesize) / 1048576 )) load=$(sysctl -n vm.loadavg)" | tee -a "$M"
          cat "$M" >> "$GITHUB_STEP_SUMMARY"

      - name: Disable expo-updates on this build copy (no OTA fetch)
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: bash
        run: |
          set -eo pipefail
          . .maestro/cm-lim.sh; trap cm_publish EXIT
          lim 60 node -e "const f='app.json';const a=require('./'+f);a.expo.updates={...a.expo.updates,enabled:false};require('fs').writeFileSync(f,JSON.stringify(a,null,2))"

      - name: npm ci
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: bash
        run: |
          set -eo pipefail
          . .maestro/cm-lim.sh; trap cm_publish EXIT
          lim 300 npm ci 2>&1 | tee out/logs/npm-ci.log

      - name: Prebuild iOS
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: bash
        run: |
          set -eo pipefail
          . .maestro/cm-lim.sh; trap cm_publish EXIT; set -a; . "$CM_FILE_ENV"; set +a
          lim 60 npx expo prebuild --platform ios --no-install 2>&1 | tee out/logs/prebuild.log

      - name: Pods
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: bash
        run: |
          set -eo pipefail
          . .maestro/cm-lim.sh; trap cm_publish EXIT; set -a; . "$CM_FILE_ENV"; set +a
          cd ios && lim 280 pod install 2>&1 | tee ../out/logs/pods.log

      - name: Build (Release, simulator, arm64)
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: bash
        run: |
          set -eo pipefail
          . .maestro/cm-lim.sh; trap cm_publish EXIT; set -a; . "$CM_FILE_ENV"; set +a
          WS=ios/app.xcworkspace; SCHEME=app; DD=build; APP="$PWD/build/Build/Products/Release-iphonesimulator/app.app"
          [ -d "$WS" ] || { echo "GATE build FAIL: $WS missing (have: $(ls -d ios/*.xcworkspace 2>/dev/null | tr '\n' ' '))"; exit 1; }
          lim 60 xcodebuild -workspace "$WS" -list -json > out/logs/schemes.json
          node -e "const s=JSON.parse(require('fs').readFileSync('out/logs/schemes.json','utf8')).workspace.schemes;console.log('schemes='+s.join(','));if(s.filter(x=>x==='app').length!==1){console.log('GATE build FAIL: scheme app not listed exactly once');process.exit(1)}"
          echo "workspace=$WS scheme=$SCHEME configuration=Release derivedData=$DD app=$APP" | tee out/logs/build-head.log
          lim 1500 xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DD" \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build > out/logs/xcodebuild.log 2>&1 || { tail -80 out/logs/xcodebuild.log; exit 1; }
          tail -40 out/logs/xcodebuild.log
          [ -d "$APP" ] || { echo "GATE build FAIL: $APP missing (have: $(ls -d build/Build/Products/Release-iphonesimulator/*.app 2>/dev/null | tr '\n' ' '))"; exit 1; }
          printf 'APP_PATH=%q\n' "$APP" >> "$CM_FILE_ENV"
          ls -la "$APP" | sed -n 1,10p

      - name: Gate b - .app, Hermes, made-up values 1 each, other values 0
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: bash
        run: |
          set -eo pipefail
          . .maestro/cm-lim.sh; trap cm_publish EXIT; set -a; . "$CM_FILE_ENV"; set +a
          lim 60 bash .maestro/cm-gates.sh bundle 2>&1 | tee out/logs/b-bundle.log

      - name: iPhone (portrait) - login, home
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: bash
        run: |
          set -eo pipefail
          . .maestro/cm-lim.sh; trap cm_publish EXIT; set -a; . "$CM_FILE_ENV"; set +a
          export PATH="$HOME/.maestro/bin:$PATH"
          export LOGIN_ID="$E2E_0003_LOGIN" LOGIN_PW="$E2E_0003_PASSWORD"
          RC=0
          bash .maestro/cm-run.sh "$IPHONE_UDID" iphone PORTRAIT 2>&1 | tee out/logs/iphone.log || RC=$?
          exit $RC

      - name: Pass marker
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: bash
        run: |
          . .maestro/cm-lim.sh; trap cm_publish EXIT
          touch out/PASS

      - name: Step times and withheld count (record only)
        if: always()
        shell: bash
        run: |
          { echo "fault=$FAULT deadline=$CM_DEADLINE_SEC t0=$(cat out/t0 2>/dev/null) end=$(date +%s)"
            cat out/iphone/result.txt 2>/dev/null || echo "no iphone result"
            echo "withheld: $(find "$HOME/cm-withheld" -type f 2>/dev/null | wc -l | tr -d ' ') files"
            grep -h '^secret-count' "$HOME/cm-publish.log" 2>/dev/null || echo "no publish log"
            cat out/fault.txt 2>/dev/null || true; } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: upload/
          retention-days: 14
