name: rehearsal
run-name: rehearsal ${{ inputs.tag || github.event_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fault:
        description: "none | a | b | c-up | d-cold | d-cap | e | noboot | mid | dl | norecord | keepboot | a-look | look | a-enter | gate-up | gate-up-500 | post-in | post-in-left | zs-hold | zs-hold-noclean | dst993 | drv | pwaf | pwaf-ctl | look-old | s1d"
        required: true
        default: none
        type: choice
        options: [none, s1dc, s1x, s1xc, s1xf, a, b, c-up, d-cold, d-cap, e, noboot, mid, dl, norecord, keepboot, a-look, look, a-enter, gate-up, gate-up-500, post-in, post-in-left, zs-hold, zs-hold-noclean, dst993, drv, pwaf, pwaf-ctl, look-old, s1d]
      gate_only:
        description: "none = full run | A = network then boot | B = boot then network (Gate a measurement only)"
        required: false
        default: none
        type: choice
        options: [none, A, B]
      stage:
        description: "2 = whole run | 1 = stage 1 only (machine, network, one sign-in, one status)"
        required: false
        default: "2"
        type: choice
        options: ["2", "1"]
      cm_tag:
        description: "CM_TAG (empty = cm-stage1-rehearsal or cm-stage2-rehearsal by stage; - = empty)"
        required: false
        default: ""
        type: string
      repo_slug:
        description: "CM_REPO_SLUG (empty = github.repository; - = empty, to test the git remote fallback)"
        required: false
        default: ""
        type: string
      tag:
        description: "label to find this run (record only)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  statuses: write

# Each run is its own group (never cancelled by another run). How many run side by side is held to the
# official limit (5 macOS jobs at a time) by the dispatcher, which counts queued and running runs first.
concurrency:
  group: rehearsal-${{ github.run_id }}
  cancel-in-progress: false

# Step order and limits follow a mirrored stage-2 layout: Gate a, updates off, npm ci, prebuild, pods,
# fixed-name build, Gate b, iPhone run, pass marker. Every step publishes out/ to upload/ only after the scrub.
jobs:
  ios-sim:
    runs-on: macos-26
    timeout-minutes: 115
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_NO_TELEMETRY: "1"
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: ${{ inputs.fault == 'dst993' && '993000' || '300000' }}
      MT_HOME: ${{ inputs.fault == 'dst993' && '1300' || '610' }}
      MT_LOGIN: ${{ inputs.fault == 'dst993' && '1500' || '1180' }}
      MT_LIST: ${{ inputs.fault == 'dst993' && '1300' || '460' }}
      PWAF: ${{ inputs.fault == 'pwaf' && '1' || '0' }}
      DRV_ONLY: ${{ inputs.fault == 'drv' && '1' || '0' }}
      ZS_CLEAN: ${{ inputs.fault == 'zs-hold-noclean' && '0' || '1' }}
      MAESTRO_VERSION: "2.12.1"
      EXPO_NO_GIT_STATUS: "1"
      MAESTRO_ZIP_SHA256: "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7"
      CM_DEADLINE_SEC: ${{ inputs.fault == 'dl' && '420' || (inputs.fault == 'd-cap' && '700' || '4800') }}
      CM_TAG: ${{ inputs.cm_tag != '-' && (inputs.cm_tag || (inputs.stage == '1' && 'cm-stage1-rehearsal' || 'cm-stage2-rehearsal')) || '' }}
      CM_BUILD_ID: ${{ github.run_id }}
      CM_COMMIT: ${{ github.sha }}
      CM_REPO_SLUG: ${{ inputs.repo_slug != '-' && github.repository || '' }}
      GH_STATUS_TOKEN: ${{ github.token }}
      CM_FILE_ENV: out/cm.env
      AUTH_REGION: ap-northeast-1
      # Made-up practice values (no account exists for them).
      E2E_0003_LOGIN: "001"
      E2E_0003_PASSWORD: Rh-Practice-9x
      FAULT: ${{ inputs.fault || 'none' }}
      GATE_ONLY: ${{ inputs.gate_only || 'none' }}
      STAGE: ${{ inputs.stage || '2' }}
      FAULT_HOOK: ${{ inputs.fault && inputs.fault != 'none' && 'rehearsal/fault.sh' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: CocoaPods 1.16.2
        shell: bash
        run: |
          sudo gem install cocoapods -v 1.16.2 --no-document > /dev/null
          P=$(command -v pod); mkdir -p "$HOME/pin-bin"
          printf '#!/bin/bash\nexec %s _1.16.2_ "$@"\n' "$P" > "$HOME/pin-bin/pod"; chmod +x "$HOME/pin-bin/pod"
          echo "$HOME/pin-bin" >> "$GITHUB_PATH"; "$HOME/pin-bin/pod" --version

      - name: Practice only - stage 1 uses the stage 1 head's cm-lim.sh (the repo copy is the stage 2 head's)
        if: env.STAGE == '1'
        shell: bash
        run: |
          SD=; case "$FAULT" in s1d|s1dc) SD=s1d;; s1x|s1xc|s1xf) SD=s1x;; esac; if [ -n "$SD" ]; then cp $SD/* .maestro/ && for x in $SD/*; do cmp "$x" ".maestro/${x#$SD/}" || exit 1; done && echo "$SD stage 1 files in place: $(ls $SD | wc -l)"; case "$FAULT" in s1dc|s1xc) sed -i '' 's/^  rc=0\\ \*) v=\$(hier driver-warm/  rc=0\\ *) clean; v=$(hier driver-warm/' .maestro/cm-probe-driver.sh; [ "$(grep -c 'clean; v=$(hier driver-warm' .maestro/cm-probe-driver.sh)" = 1 ] || exit 1; echo "control: clean-up between cold and warm";; s1xf) sed -i '' 's/hier driver-cold 1100 993)/hier driver-cold 61 60)/' .maestro/cm-probe-driver.sh; [ "$(grep -c 'hier driver-cold 61 60)' .maestro/cm-probe-driver.sh)" = 1 ] || exit 1; echo "forced: cold limit 61 wait 60";; esac; else cp rehearsal/s1-lim.sh .maestro/cm-lim.sh && cmp rehearsal/s1-lim.sh .maestro/cm-lim.sh && echo "s1 cm-lim.sh in place"; fi

      - name: Probe (stage 1, records only, always exit 0)
        if: env.STAGE == '1'
        shell: bash
        env:
          CM_TAG: ${{ inputs.cm_tag != '-' && (inputs.cm_tag || 'cm-stage1-rehearsal') || '' }}
          GH_STATUS_TOKEN: ${{ github.token }}
          CM_REPO_SLUG: ${{ inputs.repo_slug != '-' && github.repository || '' }}
          CM_COMMIT: ${{ github.sha }}
        run: |
          #!/bin/bash
          . .maestro/cm-lim.sh step=probe; trap cm_publish EXIT
          mkdir -p out/probe
          # practice only: every 30 s, counts only (processes, listening ports 7001/22087, raw driver output lines)
          ( s0=$(date +%s); while :; do c() { pgrep -f "$1" 2>/dev/null | wc -l | tr -d ' '; }; p() { lsof -nP -iTCP:"$1" -sTCP:LISTEN 2>/dev/null | tail -n +2 | wc -l | tr -d ' '; }; lp() { local q; q=$(pgrep -d, -f "$1" 2>/dev/null); [ -n "$q" ] && { lsof -a -p "$q" -iTCP -sTCP:LISTEN -nP 2>/dev/null | tail -n +2 | wc -l | tr -d ' '; } || echo -; }; w() { [ -f "$HOME/cm-probe-raw/driver-$1.txt" ] && wc -l < "$HOME/cm-probe-raw/driver-$1.txt" | tr -d ' ' || echo -; }
            echo "t=$(( $(date +%s) - s0 )) maestro=$(c "maestro[.]cli") xcodebuild=$(c xcodebuild) runner=$(c maestro-driver) xctest=$(c XCTest) l7001=$(p 7001) l22087=$(p 22087) cold=$(w cold) warm=$(w warm) again=$(w cold-again) xlisten=$(lp "[x]codebuild test-without-building") dlisten=$(lp "[m]aestro-driver-iosUITests") mlisten=$(lp "[m]aestro[.]cli")"; sleep 30; done ) > out/probe/proc-samples.txt 2>/dev/null & SP=$!
          bash .maestro/cm-probe.sh 2>&1 | tee out/probe-console.log || true
          kill $SP 2>/dev/null || true
          node rehearsal/drvshape.js "$HOME/cm-probe-raw" out/probe/driver-shape.txt || true
          exit 0

      - name: Gate a measurement (A = network then boot, B = boot then network)
        if: env.GATE_ONLY != 'none' && env.STAGE == '2'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/logs; : > "$CM_FILE_ENV"; M=out/logs/gate-measure.txt
          . .maestro/cm-lim.sh; trap cm_publish EXIT
          t() { date +%s; }
          echo "form=$GATE_ONLY runner=$RUNNER_NAME image=$ImageVersion start=$(date -u +%H:%M:%SZ)" | tee "$M"
          s=$(t); lim 90 bash .maestro/cm-gates.sh toolchain > out/logs/a-toolchain.log 2>&1; echo "toolchain rc=$? s=$(( $(t)-s ))" | tee -a "$M"
          IPHONE_UDID=$(sed -n 's/^IPHONE_UDID=//p' out/sims.env)
          boot() { s=$(t); lim 60 xcrun simctl boot "$IPHONE_UDID" > out/logs/a-boot.log 2>&1; echo "boot-cmd rc=$? s=$(( $(t)-s ))" | tee -a "$M"; BOOT_AT=$(t); }
          net() { s=$(t); lim 120 bash .maestro/netcheck.sh out/logs/a-net.txt "form-$GATE_ONLY" > /dev/null 2>&1; echo "netcheck rc=$? s=$(( $(t)-s )) $(tail -1 out/logs/a-net.txt 2>/dev/null)" | tee -a "$M"
            s=$(t); lim 400 bash -c 'set -o pipefail; curl -fsSL "https://get.maestro.mobile.dev" | bash' > out/logs/maestro-install.log 2>&1; echo "maestro-install rc=$? s=$(( $(t)-s ))" | tee -a "$M"; }
          if [ "$GATE_ONLY" = A ]; then net; boot; else boot; net; fi
          lim 480 xcrun simctl bootstatus "$IPHONE_UDID" -b > /dev/null 2>&1; echo "booted rc=$? s-from-boot-cmd=$(( $(t)-BOOT_AT ))" | tee -a "$M"
          echo "memory-after free_mb=$(( $(vm_stat | awk '/Pages free|Pages inactive|Pages speculative/ {gsub(/[.]/,"",$NF); s+=$NF} END {print s+0}') * $(sysctl -n hw.pagesize) / 1048576 )) load=$(sysctl -n vm.loadavg)" | tee -a "$M"
          cat "$M" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate a - toolchain, simulator pick, network, Maestro (first minutes, no boot)
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash
          set -eo pipefail
          mkdir -p out/logs; : > "$CM_FILE_ENV"
          . .maestro/cm-lim.sh step=a


          case "${CM_TAG:-}" in cm-stage2-*) ;; *) echo "GATE a FAIL: CM_TAG is not cm-stage2-* (nothing run, nothing written)"; exit 1;; esac
          trap cm_publish EXIT
          cm_need_values || exit 1

          GH_STATUS_TOKEN="$CM_GHT" limf 30 node .maestro/cm-ghstatus.js codemagic/ios-sim-verify pending "stage 2 running" || true
          lim 250 bash .maestro/cm-gates.sh toolchain 2>&1 | tee out/logs/a-toolchain.log



          lim 30 bash .maestro/netcheck.sh out/logs/a-net.txt gate-a || { cm_say "GATE a FAIL: Cognito unreachable from the Mac"; exit 1; }




          MZ_URL="https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          MZ="$HOME/maestro-$MAESTRO_VERSION.zip"; MOK=0; MA=0
          for a in 1 2; do
            MA=$a
            if lim 300 curl -fsSL -o "$MZ" "$MZ_URL" 2>>out/logs/maestro-install.log && [ "$(shasum -a 256 "$MZ" | cut -c1-64)" = "$MAESTRO_ZIP_SHA256" ]; then MOK=1; break; fi
            echo "maestro-download attempt $a failed (rc 142 = over the limit, or the sha256 differs)" | tee -a out/logs/maestro-install.log
            if [ "$a" = 1 ]; then sleep 20; fi
          done
          echo "maestro-download attempts=$MA ok=$MOK" | tee -a out/logs/maestro-install.log
          [ "$MOK" = 1 ] || { cm_say "GATE a FAIL: maestro zip with the pinned sha256 not downloaded in 2 attempts"; exit 1; }
          mkdir -p "$HOME/mz" "$HOME/.maestro"
          lim 120 unzip -qo "$MZ" -d "$HOME/mz" 2>&1 | tee -a out/logs/maestro-install.log
          cp -R "$HOME/mz/maestro/." "$HOME/.maestro/"

          MVS=$(lim 30 "$HOME/.maestro/bin/maestro" --version 2>/dev/null | { grep -x -E '[0-9]+\.[0-9]+\.[0-9]+' || true; } | sort -u | tr '\n' ' ' | sed 's/ $//') || MVS=""
          echo "maestro $MVS" | tee -a out/logs/maestro-install.log
          [ "$MVS" = "$MAESTRO_VERSION" ] || { cm_say "GATE a FAIL: maestro [$MVS], expected exactly $MAESTRO_VERSION"; exit 1; }
          cm_say "GATE a ok"

      - name: Dev env from eas.json preview-dev (dev values only)
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash
          set -eo pipefail
          . .maestro/cm-lim.sh step=env; trap cm_publish EXIT
          lim 210 node .maestro/cm-step.js eas-dev-env > out/eas-dev.env
          while IFS= read -r l; do printf '%s=%q\n' "${l%%=*}" "${l#*=}"; done < out/eas-dev.env >> "$CM_FILE_ENV"
          echo "pool=dev keys=$(wc -l < out/eas-dev.env | tr -d ' ')" | tee out/logs/env.log

      - name: Disable expo-updates on this build copy (no OTA fetch)
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash
          set -eo pipefail
          . .maestro/cm-lim.sh step=updates; trap cm_publish EXIT
          lim 90 node .maestro/cm-step.js updates-off

      - name: npm ci
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash
          set -eo pipefail
          . .maestro/cm-lim.sh step=npm; trap cm_publish EXIT
          lim 780 npm ci 2>&1 | tee out/logs/npm-ci.log

      - name: Prebuild iOS
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash
          set -eo pipefail
          . .maestro/cm-lim.sh step=prebuild; trap cm_publish EXIT; set -a; . "$CM_FILE_ENV"; set +a
          lim 60 npx expo prebuild --platform ios --no-install 2>&1 | tee out/logs/prebuild.log

      - name: Pods
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash
          set -eo pipefail
          . .maestro/cm-lim.sh step=pods; trap cm_publish EXIT; set -a; . "$CM_FILE_ENV"; set +a
          cd ios && lim 680 pod install 2>&1 | tee ../out/logs/pods.log

      - name: Practice only - fault mid (workspace removed), norecord (no record in 7 months) or a-look/look (app log level), before the build
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash
          if [ "$FAULT" = mid ]; then rm -rf ios/app.xcworkspace; echo "fault mid: ios/app.xcworkspace removed" | tee -a out/fault.txt; fi
          if [ "$FAULT" = look-old ] || [ "$FAULT" = pwaf ] || [ "$FAULT" = pwaf-ctl ]; then cp rehearsal/index-old.tsx app/index.tsx; echo "fault look-old: older password row n=$(grep -c secureTextEntry app/index.tsx)" | tee -a out/fault.txt; fi
          case "$FAULT" in a-look|look|a-enter|gate-up|gate-up-500|post-in|post-in-left|look-old|pwaf|pwaf-ctl) sed -i '' 's/console\.log(`\[REHEARSAL\]/console.error(`[REHEARSAL]/; s/console\.log('"'"'\[REHEARSAL\]/console.error('"'"'[REHEARSAL]/' app/index.tsx src/auth.ts; echo "fault $FAULT: app log lines to the error level n=$(cat app/index.tsx src/auth.ts | grep -c 'console.error(.\[REHEARSAL\]')" | tee -a out/fault.txt;; esac
          if [ "$FAULT" = norecord ]; then sed -i '' 's/back >= 1 ?/back >= 99 ?/' app/list.tsx; echo "fault norecord: record hidden n=$(grep -c 'back >= 99' app/list.tsx)" | tee -a out/fault.txt; fi

      - name: Build (Release, simulator, arm64)
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash
          set -eo pipefail
          . .maestro/cm-lim.sh step=build; trap cm_publish EXIT; set -a; . "$CM_FILE_ENV"; set +a



          WS=ios/app.xcworkspace; SCHEME=app; DD=build; APP="$PWD/build/Build/Products/Release-iphonesimulator/app.app"
          [ -d "$WS" ] || { cm_say "GATE build FAIL: $WS missing (have: $(ls -d ios/*.xcworkspace 2>/dev/null | tr '\n' ' '))"; exit 1; }
          lim 120 xcodebuild -workspace "$WS" -list -json > out/logs/schemes.json
          lim 30 node .maestro/cm-step.js scheme-once out/logs/schemes.json "$SCHEME"
          echo "workspace=$WS scheme=$SCHEME configuration=Release derivedData=$DD app=$APP" | tee out/logs/build-head.log
          lim 2780 xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DD" \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build > out/logs/xcodebuild.log 2>&1 || { tail -80 out/logs/xcodebuild.log; exit 1; }
          tail -40 out/logs/xcodebuild.log
          [ -d "$APP" ] || { cm_say "GATE build FAIL: $APP missing (have: $(ls -d build/Build/Products/Release-iphonesimulator/*.app 2>/dev/null | tr '\n' ' '))"; exit 1; }
          printf 'APP_PATH=%q\n' "$APP" >> "$CM_FILE_ENV"
          ls -la "$APP" | sed -n 1,10p

      - name: Gate b - .app, Hermes, dev 1 each, prod 0
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash
          set -eo pipefail
          . .maestro/cm-lim.sh step=b; trap cm_publish EXIT; set -a; . "$CM_FILE_ENV"; set +a
          lim 60 bash .maestro/cm-gates.sh bundle 2>&1 | tee out/logs/b-bundle.log

      - name: Practice only - fault noboot (simulator deleted) or keepboot (left booted after cm-run.sh)
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash
          set -a; . "$CM_FILE_ENV"; set +a
          if [ "$FAULT" = noboot ]; then xcrun simctl delete "$IPHONE_UDID"; echo "fault noboot: simulator deleted rc=$?" | tee -a out/fault.txt; fi
          if [ "$FAULT" = keepboot ]; then sed -i '' 's/^  limf 30 xcrun simctl shutdown "$UDID"/  : keepboot; true/' .maestro/cm-run.sh; echo "fault keepboot: simulator left booted n=$(grep -c ': keepboot' .maestro/cm-run.sh)" | tee -a out/fault.txt; fi

      - name: iPhone (portrait) - login, home, list, one record
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash
          set -eo pipefail
          . .maestro/cm-lim.sh step=iphone; trap cm_publish EXIT; set -a; . "$CM_FILE_ENV"; set +a
          export PATH="$HOME/.maestro/bin:$PATH"
          export LOGIN_ID="${E2E_0003_LOGIN:-}" LOGIN_PW="${E2E_0003_PASSWORD:-}"
          RC=0
          bash .maestro/cm-run.sh "$IPHONE_UDID" iphone PORTRAIT 2>&1 | tee out/logs/iphone.log || RC=$?

          exit $RC

      - name: Pass marker
        if: env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash
          . .maestro/cm-lim.sh step=pass; trap cm_publish EXIT

          OKN=0
          grep -q '^GATE toolchain ok' out/logs/a-toolchain.log 2>/dev/null && OKN=$((OKN+1))
          grep -q '^pool=dev ' out/logs/env.log 2>/dev/null && OKN=$((OKN+1))
          grep -q '^GATE bundle ok' out/logs/b-bundle.log 2>/dev/null && OKN=$((OKN+1))
          grep -q '^iphone-result=ok$' out/iphone/result.txt 2>/dev/null && OKN=$((OKN+1))
          cm_say "pass-check $OKN of 4 (toolchain, dev env, bundle, iphone-result=ok)"
          [ "$OKN" = 4 ] || { cm_say "PASS not written: $OKN of 4"; exit 1; }
          touch out/PASS

      - name: Pass or fail to the GitHub commit status
        if: always() && env.GATE_ONLY == 'none' && env.STAGE == '2'
        shell: /bin/bash --noprofile --norc {0}
        run: |
          #!/bin/bash

          case "${CM_TAG:-}" in cm-stage2-*) ;; *) echo "status skipped=tag-not-cm-stage2"; exit 0;; esac
          . .maestro/cm-lim.sh step=status
          S=failure; [ -f out/PASS ] && S=success
          GH_STATUS_TOKEN="$CM_GHT" limf 60 node .maestro/cm-ghstatus.js codemagic/ios-sim-verify "$S" "stage 2 $S"



          GH_STATUS_TOKEN="$CM_GHT" limf 45 node .maestro/cm-s2-status.js upload out/logs/causes.txt || true

      - name: Step times and withheld count (record only)
        if: always()
        shell: bash
        run: |
          { echo "fault=$FAULT deadline=$CM_DEADLINE_SEC t0=$(cat out/t0 2>/dev/null) end=$(date +%s)"
            cat out/iphone/result.txt 2>/dev/null || echo "no iphone result"
            echo "withheld: $(find "$HOME/cm-withheld" -type f 2>/dev/null | wc -l | tr -d ' ') files"
            grep -h '^secret-count' "$HOME/cm-publish.log" 2>/dev/null || echo "no publish log"
            cat out/fault.txt 2>/dev/null || true; } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: upload/
          retention-days: 14
