

appId: dev.rehearsal.sim
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "れんしゅう"
    timeout: 90000
- waitForAnimationToEnd

- runFlow:
    when:
      visible: "ID・パスワードでログイン"
    commands:
      - takeScreenshot: 00-mode
      - tapOn: "ID・パスワードでログイン"
- extendedWaitUntil:
    visible: "例: 001"
    timeout: 30000
- runFlow:
    when:
      true: ${ORIENT == "LANDSCAPE"}
    commands:
      - setOrientation: LANDSCAPE_LEFT
      - waitForAnimationToEnd
- takeScreenshot: 01-login
- tapOn: "例: 001"
- inputText: ${LOGIN_ID}
- tapOn:
    text: "パスワード"
    index: 1
- inputText: ${LOGIN_PW}
- pressKey: Enter
