appId: dev.rehearsal.sim
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "れんしゅう"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
      visible: "ID・パスワードでログイン"
    commands:
      - tapOn: "ID・パスワードでログイン"
- extendedWaitUntil:
    visible: "例: 001"
    timeout: 30000
- runFlow:
    when:
      true: ${ORIENT == "LANDSCAPE"}
    commands:
      - setOrientation: LANDSCAPE_LEFT
      - waitForAnimationToEnd:
          timeout: 1500
- tapOn: "例: 001"
- eraseText: 20
- inputText: ${LOGIN_ID}
- tapOn:
    text: "パスワード"
    index: 1
- eraseText: 40
- inputText: ${LOGIN_PW}
- pressKey: Enter
